name: 큐레이션 자동 발행 (주 2회)

on:
  schedule:
    # 월·금 06:00 KST = 일·목 21:00 UTC. GitHub 스케줄 지연으로 수 분~수십 분 늦을 수 있음.
    - cron: "0 21 * * 0,4"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-curation
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: pip install anthropic

      - name: Run curation check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_curation.py

      - name: Commit & publish
        run: |
          if git diff --quiet curated.json; then
            echo "curated.json 변경 없음 — 발행 생략"
            exit 0
          fi
          git config user.name "sweetspot-curation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add curated.json
          git commit -m "자동 큐레이션: $(TZ=Asia/Seoul date +%Y-%m-%d) 점검 반영"
          git push

      - name: Open review issue (사람 확인 필요 사항)
        if: ${{ hashFiles('review_notes.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "큐레이션 검토 필요 ($(TZ=Asia/Seoul date +%Y-%m-%d))" \
            --body-file review_notes.md
