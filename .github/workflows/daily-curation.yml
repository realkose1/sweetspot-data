name: 큐레이션 자동 발행 (매일 점검 · 조건부 실행)

# 매일 아침 무료 사전 점검(scripts/precheck.py)이 먼저 돌고, Claude를 부를 이유가
# 있는 날에만 큐레이션(scripts/daily_curation.py)이 돈다. 이유가 무엇인지는
# precheck.py 머리말에 있다. 요약하면: 화·목 기본 점검, 어떤 작품의 개봉일 ±3일,
# TMDB 한국 상영작에 새 작품 등장, TMDB 개봉일과 curated.json 불일치, 수동 실행.
#
# 2026-09-01 이전에는 월·금 무조건 실행이었다. 회당 $0.4 안팎인데 대부분 "변경
# 없음"으로 끝났고, 요일도 수요일 개봉 사이클과 어긋나 있었다. 지금 구조는
# 매일 살펴보되 돈은 판이 바뀐 날에만 쓴다.

on:
  schedule:
    # 매일 06:00 KST = 21:00 UTC. GitHub 스케줄 지연으로 수 분~수십 분 늦을 수 있음.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "사전 점검만 실행하고 Claude 단계는 건너뜀 (배선 확인용, 비용 0)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-curation
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 쓰므로 pip 설치 없음 — 이 단계는 몇 초면 끝나고 비용도 없다.
      - name: 사전 점검 (무료)
        id: pre
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          # 수동 실행은 항상 Claude를 부른다. dry_run이면 아래 조건에서 다시 걸러진다.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/precheck.py

      - name: 실행 사유
        run: 'echo "run=${{ steps.pre.outputs.run }} — ${{ steps.pre.outputs.reason }}"'

      - name: Install SDK
        if: ${{ steps.pre.outputs.run == 'true' && inputs.dry_run != true }}
        run: pip install anthropic

      - name: Run curation check
        if: ${{ steps.pre.outputs.run == 'true' && inputs.dry_run != true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_curation.py

      # 건너뛴 날에도 기준 날짜는 오늘로 옮긴다. 앱의 "포맷 데이터 기준 N월 N일"
      # 라벨이 dataTimestamp를 읽는데, 사전 점검이 "새 개봉 없음·개봉일 그대로"를
      # 실제로 확인한 날이므로 그 날짜를 기준으로 삼을 근거가 있다(2026-09-04,
      # owner 결정). 대가는 curated.json에 매일 한 줄짜리 커밋이 쌓이는 것 —
      # 의도된 동작이다. Claude가 돈 날은 daily_curation.py가 이미 갱신했으므로
      # 이 단계는 건너뛴 날에만 돈다. 시각 형식은 daily_curation.py와 동일.
      - name: 기준 날짜 갱신 (변경 없음)
        if: ${{ steps.pre.outputs.run != 'true' && inputs.dry_run != true }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          p = "curated.json"
          d = json.load(open(p, encoding="utf-8"))
          d["dataTimestamp"] = datetime.now(timezone(timedelta(hours=9))).strftime("%Y-%m-%dT%H:%M:%S+09:00")
          open(p, "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=2) + "\n")
          print("dataTimestamp →", d["dataTimestamp"])
          PY

      # tmdb_snapshot.json도 함께 커밋한다. 스냅샷은 사전 점검이 새 작품을 봤을 때만
      # 바뀌고, 그 날은 Claude가 도는 날이다. Claude 단계가 실패하면 여기까지 오지
      # 않아 스냅샷도 커밋되지 않는다 — 그러면 다음 날 같은 작품이 다시 "새 작품"
      # 으로 잡혀 자연스럽게 재시도된다.
      - name: Commit & publish
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet -- curated.json tmdb_snapshot.json && [ -z "$(git ls-files --others --exclude-standard tmdb_snapshot.json)" ]; then
            echo "curated.json / tmdb_snapshot.json 변경 없음 — 발행 생략"
            exit 0
          fi
          git config user.name "sweetspot-curation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add curated.json tmdb_snapshot.json
          if [ "${{ steps.pre.outputs.run }}" = "true" ]; then
            git commit -m "자동 큐레이션: $(TZ=Asia/Seoul date +%Y-%m-%d) 점검 반영 (${{ steps.pre.outputs.reason }})"
          else
            git commit -m "일일 점검: $(TZ=Asia/Seoul date +%Y-%m-%d) 변경 없음 — 기준 날짜 갱신"
          fi
          git push

      - name: Open review issue (사람 확인 필요 사항)
        if: ${{ steps.pre.outputs.run == 'true' && inputs.dry_run != true && hashFiles('review_notes.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "큐레이션 검토 필요 ($(TZ=Asia/Seoul date +%Y-%m-%d))" \
            --body-file review_notes.md
