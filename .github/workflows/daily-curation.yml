name: 큐레이션 자동 발행 (매일 상영 수집 · 조건부 큐레이션)

# 순서: screening.py → precheck.py → (조건부) daily_curation.py → 커밋
# (docs/screening-contract.md "봇 동작")
#
# 1. screening.py — KOBIS 상영스케줄로 screening.json을 만든다. 무료·무키이고 매일
#    돈다. 실패해도 **큐레이션을 막지 않는다** — 두 봇은 실패 모드가 다르고, 하나가
#    죽어도 다른 하나는 살아야 한다는 것이 이 설계의 전제다. 대신 이슈 하나를 연다.
# 2. precheck.py — Claude를 부를 이유가 있는 날인지 무료로 판정한다. 이유는 그
#    스크립트 머리말에 있다. 요약: 화·목 기본 점검, 개봉일 ±3일, TMDB 새 상영작,
#    TMDB 개봉일 불일치, 수동 실행, **KOBIS 상영 후보 잔존**(2026-09-20 추가).
# 3. daily_curation.py — 유료 단계. 후보에서 작품을 추가할 수도 있다.
#
# 이슈는 여섯 가지 때만 연다: 작품 추가 · 배지 변경 · 프리미엄 은퇴 ·
# 후보 확인 필요(TMDB로 특정 실패) · screening 중단 · 피드 감사 실패(커밋 보류).
# 매일 열리던 "큐레이션 검토 필요" 이슈는 폐지했다 — 매일 열리는 알림은 곧 아무도
# 읽지 않는 알림이 된다. notices는 Actions 로그에만 남는다.

on:
  schedule:
    # 매일 06:00 KST = 21:00 UTC. GitHub 스케줄 지연으로 수 분~수십 분 늦을 수 있음.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "수집·사전 점검만 실행하고 Claude 단계와 커밋을 건너뜀 (배선 확인용, 비용 0)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-curation
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    # 수집 30분 + 큐레이션(웹 검색 6회) + 커밋에 여유를 둔 값. 기본값 360분짜리
    # 잡이 매달려 있으면 concurrency group 때문에 다음 날 실행까지 막힌다.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 쓴다. 249회 호출, 비용 0. 러너에서는 회당 3.4초가 나와
      # 14분쯤 걸린다(2026-09-20 CI 실측; 로컬 한국에서는 0.2~0.6초).
      #
      # 시간 방어가 세 겹이다. 안쪽이 먼저 걸려야 이유가 남는다:
      #   1. 스크립트의 시간 예산 25분 → 남은 요청을 실패로 처리하고 사유를 적는다
      #   2. 이 단계의 timeout-minutes 30분 → 러너가 죽인다. 사유 파일이 없다
      #   3. 잡의 timeout-minutes 50분
      #
      # continue-on-error가 필요하다. 이게 없으면 2번(단계 타임아웃)에 걸릴 때
      # 잡이 실패로 끝나 아래 이슈 단계도 사전 점검도 건너뛰어진다 — 두 봇은
      # 서로를 막지 않아야 한다는 전제가 바로 여기서 깨진다. outcome은 실제
      # 결과('failure')를 유지하므로 아래 조건이 그걸 읽는다.
      - name: 상영 데이터 수집 (무료)
        id: screening
        timeout-minutes: 30
        continue-on-error: true
        run: |
          set +e
          python scripts/screening.py ${{ inputs.dry_run == true && '--dry-run' || '' }}
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::screening.py 종료 코드 $code — 큐레이션 단계는 계속한다"
          fi

      # 같은 제목의 열린 이슈가 있으면 열지 않는다. 전송 장애는 며칠 이어질 수 있고,
      # 그때마다 새 이슈를 열면 알림만 쌓인다.
      #
      # 조건이 두 갈래인 이유: 스크립트가 스스로 멈추면 code가 2나 3이지만,
      # 단계가 timeout-minutes에 죽으면 $GITHUB_OUTPUT에 아무것도 쓰이지 못해
      # code가 **빈 문자열**이 된다. 그 경우를 outcome으로 잡는다 — 빈 문자열과
      # '0'의 비교에 기대는 것보다 의도가 분명하다.
      - name: 상영 수집 중단 이슈
        if: ${{ inputs.dry_run != true && (steps.screening.outcome != 'success' || steps.screening.outputs.code != '0') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "상영 데이터 수집 중단 (screening.py)"
        run: |
          existing=$(gh issue list --state open --limit 100 \
            --json title --jq "map(select(.title == \"$TITLE\")) | length")
          if [ "$existing" != "0" ]; then
            echo "같은 제목의 열린 이슈가 있음 — 새로 열지 않음"
            exit 0
          fi
          {
            echo "단계 결과: ${{ steps.screening.outcome }} / 종료 코드: '${{ steps.screening.outputs.code }}'"
            echo
            if [ -f screening_abort.txt ]; then
              cat screening_abort.txt
            else
              echo "사유 파일(screening_abort.txt)이 없습니다 — 스크립트가 이유를 적기"
              echo "전에 단계가 죽었다는 뜻입니다. timeout-minutes(30분)에 걸렸을"
              echo "가능성이 큽니다. 위 로그의 진행 줄에서 회당 지연을 확인하세요."
            fi
            echo
            echo "screening.json은 갱신되지 않았다. 앱은 checkedAt이 3일 넘게 지나면"
            echo "기존 포맷 후보 모드로 돌아간다 — 잘못된 목록을 보여주지는 않는다."
          } > /tmp/abort-body.md
          gh issue create --title "$TITLE" --body-file /tmp/abort-body.md

      - name: 사전 점검 (무료)
        id: pre
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          # 수동 실행은 항상 Claude를 부른다. dry_run이면 아래 조건에서 다시 걸러진다.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/precheck.py

      - name: 실행 사유
        run: 'echo "run=${{ steps.pre.outputs.run }} — ${{ steps.pre.outputs.reason }}"'

      - name: Install SDK
        if: ${{ steps.pre.outputs.run == 'true' && inputs.dry_run != true }}
        run: pip install anthropic

      - name: Run curation check
        if: ${{ steps.pre.outputs.run == 'true' && inputs.dry_run != true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_curation.py

      # 건너뛴 날에도 기준 날짜는 오늘로 옮긴다. 앱의 "포맷 데이터 기준 N월 N일"
      # 라벨이 dataTimestamp를 읽는데, 사전 점검이 "새 개봉 없음·개봉일 그대로"를
      # 실제로 확인한 날이므로 그 날짜를 기준으로 삼을 근거가 있다(2026-09-04,
      # owner 결정). 대가는 curated.json에 매일 한 줄짜리 커밋이 쌓이는 것 —
      # 의도된 동작이다. Claude가 돈 날은 daily_curation.py가 이미 갱신했으므로
      # 이 단계는 건너뛴 날에만 돈다. 시각 형식은 daily_curation.py와 동일.
      - name: 기준 날짜 갱신 (변경 없음)
        if: ${{ steps.pre.outputs.run != 'true' && inputs.dry_run != true }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          p = "curated.json"
          d = json.load(open(p, encoding="utf-8"))
          d["dataTimestamp"] = datetime.now(timezone(timedelta(hours=9))).strftime("%Y-%m-%dT%H:%M:%S+09:00")
          open(p, "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=2) + "\n")
          print("dataTimestamp →", d["dataTimestamp"])
          PY

      # 발행 직전 감사. 2026-09-24 residentevil 사고(관측 없는 배지 5개 → 1.0 앱의
      # 배지 줄이 넘쳐 영화 탭 레이아웃이 깨짐)의 마지막 그물이다. 배지 4개 초과 ·
      # 작품 배지의 SUPERPLEX/DOLBYVISION · recommendedFormat ∉ badges · 배지에 없는
      # 포맷을 부르는 hook/meta 중 하나라도 있으면 커밋하지 않고 이슈를 연다.
      # 스크립트는 표준 라이브러리만 쓴다(Claude를 건너뛴 날엔 SDK가 없다).
      - name: 피드 감사
        id: audit
        if: ${{ inputs.dry_run != true }}
        run: |
          set +e
          python scripts/audit_feed.py > /tmp/audit.txt 2>&1
          code=$?
          set -e
          cat /tmp/audit.txt
          if [ "$code" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::피드 감사 실패 — 커밋을 건너뛴다"
          fi

      - name: 피드 감사 실패 이슈
        if: ${{ inputs.dry_run != true && steps.audit.outcome == 'success' && steps.audit.outputs.ok != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "피드 감사 실패"
        run: |
          existing=$(gh issue list --state open --limit 100 \
            --json title --jq "map(select(.title == \"$TITLE\")) | length")
          if [ "$existing" != "0" ]; then
            echo "같은 제목의 열린 이슈가 있음 — 새로 열지 않음"
          else
            {
              echo "scripts/audit_feed.py가 curated.json에서 규칙 위반을 찾았다."
              echo "이번 실행의 결과는 **커밋하지 않았다** — 앱은 어제 피드를 계속 본다."
              echo
              echo '```'
              cat /tmp/audit.txt
              echo '```'
            } > /tmp/audit-body.md
            gh issue create --title "$TITLE" --body-file /tmp/audit-body.md
          fi
          # 실행을 빨간색으로 남긴다. 아래 커밋·변경 이슈 단계는 조건으로 건너뛴다.
          exit 1

      # 커밋 대상 여섯 개:
      #   curated.json           앱이 읽는 큐레이션 피드
      #   screening.json         앱이 읽는 "지금 상영 중" (매일 바뀐다)
      #   screening_state.json   봇 내부 상태 — 은퇴 카운터·처리한 후보. 커밋해야
      #                          다음 실행이 어제를 기억한다
      #   screening_candidates.json  다음 실행의 precheck 트리거 입력
      #   kobis_movies.json      작품을 추가한 날 매핑도 같이 늘어난다
      #   tmdb_snapshot.json     사전 점검이 새 작품을 봤을 때만 바뀐다
      # Claude 단계가 실패하면 여기까지 오지 않아 스냅샷도 커밋되지 않는다 —
      # 그러면 다음 날 같은 작품이 다시 "새 작품"으로 잡혀 자연스럽게 재시도된다.
      - name: Commit & publish
        if: ${{ inputs.dry_run != true && steps.audit.outputs.ok == 'true' }}
        env:
          TRACKED: curated.json screening.json screening_state.json screening_candidates.json kobis_movies.json tmdb_snapshot.json
        run: |
          # screening.py가 중단한 날에는 screening.json이 아예 없을 수 있다.
          # 없는 경로를 git add에 넘기면 fatal이므로 있는 것만 고른다.
          present=""
          for f in $TRACKED; do [ -e "$f" ] && present="$present $f"; done
          if [ -z "$present" ]; then echo "발행 대상 파일 없음 — 생략"; exit 0; fi
          git add -A -- $present
          if git diff --cached --quiet; then
            echo "발행할 변경 없음 — 생략"
            exit 0
          fi
          git config user.name "sweetspot-curation-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.pre.outputs.run }}" = "true" ]; then
            git commit -m "자동 큐레이션: $(TZ=Asia/Seoul date +%Y-%m-%d) 점검 반영 (${{ steps.pre.outputs.reason }})"
          else
            git commit -m "일일 점검: $(TZ=Asia/Seoul date +%Y-%m-%d) 상영 데이터 갱신 · 큐레이션 변경 없음"
          fi
          git push

      # 이슈를 여는 유일한 다른 경로. screening.py(은퇴)와 daily_curation.py(작품
      # 추가·배지 변경)가 같은 파일에 덧붙이고, 여기서 한 건당 이슈 하나를 연다.
      # 제목이 같은 열린 이슈가 있으면 건너뛴다.
      - name: 변경 이슈 (작품 추가 · 배지 변경 · 은퇴 · 후보 확인)
        if: ${{ inputs.dry_run != true && steps.audit.outputs.ok == 'true' && hashFiles('screening_changes.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/issues
          python - <<'PY'
          # 본문을 파일로 떨군다. 셸 변수에 담아 printf로 되살리면 JSON 안의
          # 백슬래시가 이스케이프로 해석되어 본문이 망가진다.
          import json, pathlib
          kinds = {"newWork": "작품 추가", "badgeChange": "배지 변경",
                   "retirement": "프리미엄 은퇴", "needsHuman": "후보 확인 필요"}
          doc = json.load(open("screening_changes.json", encoding="utf-8"))
          index = []
          for i, c in enumerate(doc.get("changes", [])):
              label = kinds.get(c.get("kind"), c.get("kind") or "변경")
              # needsHuman은 아직 work가 아니라 후보다 — workId가 없으므로
              # movieCd로 제목을 만든다(같은 후보로 매일 이슈가 열리지 않게 dedupe도 이 제목 기준).
              subject = c.get("workId") or f"{c.get('kobisNm', '?')} ({c.get('movieCd', '?')})"
              title = f"{label}: {subject}"
              body = pathlib.Path(f"/tmp/issues/{i}.md")
              body.write_text(
                  json.dumps(c, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              index.append(f"{title}\t{body}")
          pathlib.Path("/tmp/issues/index.tsv").write_text(
              "\n".join(index) + ("\n" if index else ""), encoding="utf-8")
          print(f"이슈 후보 {len(index)}건")
          PY
          while IFS=$'\t' read -r title body; do
            [ -z "$title" ] && continue
            existing=$(gh issue list --state open --limit 100 \
              --json title --jq "map(select(.title == \"$title\")) | length")
            if [ "$existing" != "0" ]; then
              echo "이미 열린 이슈: $title — 생략"
              continue
            fi
            gh issue create --title "$title" --body-file "$body"
            echo "이슈 생성: $title"
          done < /tmp/issues/index.tsv
